<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Badge -->
  <rect width="512" height="512" rx="128" fill="#090d16" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#grad1)" opacity="0.15" />
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="url(#grad1)" stroke-width="8" opacity="0.5" />
  
  <!-- Globe / World Network Graphic -->
  <circle cx="256" cy="256" r="160" stroke="url(#grad1)" stroke-width="20" stroke-linecap="round" fill="none" />
  <ellipse cx="256" cy="256" rx="80" ry="160" stroke="url(#grad1)" stroke-width="16" stroke-dasharray="24 16" fill="none" opacity="0.8" />
  <line x1="96" y1="256" x2="416" y2="256" stroke="url(#grad1)" stroke-width="16" stroke-linecap="round" opacity="0.8" />
  
  <!-- Ascending Growth / Price Arrow -->
  <path d="M160 330 L230 260 L290 310 L380 200" stroke="#10b981" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M320 200 H380 V260" stroke="#10b981" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Container / Cargo Ship Emblem Badge -->
  <circle cx="380" cy="380" r="56" fill="#6366f1" />
  <path d="M352 380 L360 400 H400 L408 380 Z" fill="#ffffff" />
  <rect x="364" y="364" width="12" height="12" fill="#38bdf8" rx="2" />
  <rect x="380" y="364" width="12" height="12" fill="#f59e0b" rx="2" />
</svg>