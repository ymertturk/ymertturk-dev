<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="8"/>

  <!-- Neural Brain Nodes & Connections -->
  <g filter="url(#glow)" stroke="url(#brainGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Brain Outline & Neural Links -->
    <path d="M 256,110 C 190,110 140,150 140,210 C 140,240 152,265 170,285 C 160,310 170,340 195,355 C 220,370 240,360 256,380 C 272,360 292,370 317,355 C 342,340 352,310 342,285 C 360,265 372,240 372,210 C 372,150 322,110 256,110 Z"/>

    <line x1="256" y1="110" x2="256" y2="380" stroke-opacity="0.4"/>
    <line x1="190" y1="160" x2="256" y2="210"/>
    <line x1="322" y1="160" x2="256" y2="210"/>
    <line x1="150" y1="220" x2="220" y2="250"/>
    <line x1="362" y1="220" x2="292" y2="250"/>
    <line x1="220" y1="250" x2="256" y2="210"/>
    <line x1="292" y1="250" x2="256" y2="210"/>
    <line x1="220" y1="250" x2="210" y2="330"/>
    <line x1="292" y1="250" x2="302" y2="330"/>
    <line x1="210" y1="330" x2="256" y2="380"/>
    <line x1="302" y1="330" x2="256" y2="380"/>
  </g>

  <!-- Glowing Neural Synapse Nodes -->
  <g fill="#38bdf8">
    <circle cx="256" cy="110" r="10"/>
    <circle cx="190" cy="160" r="9"/>
    <circle cx="322" cy="160" r="9"/>
    <circle cx="150" cy="220" r="8"/>
    <circle cx="362" cy="220" r="8"/>
    <circle cx="256" cy="210" r="12" fill="#60a5fa"/>
    <circle cx="220" cy="250" r="9"/>
    <circle cx="292" cy="250" r="9"/>
    <circle cx="210" cy="330" r="9"/>
    <circle cx="302" cy="330" r="9"/>
    <circle cx="256" cy="380" r="10" fill="#a78bfa"/>
  </g>
</svg>
