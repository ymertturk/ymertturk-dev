<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
  </defs>
  <!-- Rounded Base Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0f172a" stroke="url(#boxGrad)" stroke-width="2.5"/>
  
  <!-- FBA Package Isometric Box Icon -->
  <path d="M32 10 L52 20 L32 30 L12 20 Z" fill="url(#boxGrad)" opacity="0.9"/>
  <path d="M12 20 L32 30 L32 50 L12 40 Z" fill="#3730a3" opacity="0.95"/>
  <path d="M32 30 L52 20 L52 40 L32 50 Z" fill="#6b21a8" opacity="0.95"/>
  
  <!-- Tape line on box top -->
