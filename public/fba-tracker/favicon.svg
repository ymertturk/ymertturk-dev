  <!-- Upward Trend Chart Arrow overlay -->
  <path d="M16 44 L28 34 L36 40 L48 24" fill="none" stroke="url(#arrowGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40 24 L48 24 L48 32" fill="none" stroke="url(#arrowGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
