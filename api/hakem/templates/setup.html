{% extends "base.html" %}

{% block content %}
<div class="container" style="justify-content: center; margin-top: 50px;">
    <div class="card" style="width: 100%; max-width: 500px; text-align: center;">
        <h1>Sistem Kurulumu</h1>
        <p style="color: #718096; margin-bottom: 30px;">Lütfen giriş türünü seçiniz.</p>

        <div style="display: flex; flex-direction: column; gap: 20px;">
            <a href="/login?mode=admin"
                style="background: #2d3748; color: white; padding: 15px; border-radius: 8px; text-decoration: none; font-weight: bold;">
                Admin Girişi
            </a>

            <form action="/setup/register" method="post">
                <input type="hidden" name="mode" value="new_user">
                <button type="submit" style="width: 100%; padding: 15px; font-size: 1em; background: #3182ce;">
                    Yeni Kullanıcı (Cihazı Kaydet)
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
